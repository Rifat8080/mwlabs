name: mwlabs-command

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mwlabs_command
      MYSQL_USER: mwlabs_app
      MYSQL_PASSWORD: mwlabs_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
      TZ: UTC
    volumes:
      - mwlabs_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mwlabs_mysql_data:
